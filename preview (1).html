<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amlan & Lori Photo Spinner</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1050px;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            flex: 1;
            min-width: 350px;
        }

        h1, h2 {
            margin-top: 0;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .spinner-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ef4444;
            z-index: 20;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        canvas {
            display: block;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 4s cubic-bezier(0.15, 0.90, 0.15, 1);
            background-color: #eee;
        }

        /* Center Spin Button Overlay */
        .center-spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #391E10, #391E10);
            color: white;
            border: 4px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 1.1;
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 15;
            transition: transform 0.1s, background 0.2s;
        }

        .center-spin-btn:hover {
            background: linear-gradient(135deg, #4338ca, #3730a3);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .center-spin-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .center-spin-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: translate(-50%, -50%);
        }

        #result {
            margin-top: 15px;
            font-size: 1.25rem;
            font-weight: bold;
            min-height: 30px;
            color: var(--primary-color);
        }

        /* Controls Panel */
        .controls-panel {
            text-align: left;
            max-height: 550px;
            overflow-y: auto;
        }

        .item-row {
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 12px;
        }

        .item-top {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-row input[type="text"] {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .item-row input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            background-color: #e5e7eb;
            color: #374151;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .file-upload-btn:hover {
            background-color: #d1d5db;
        }

        .delete-btn {
            background-color: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background-color: #fca5a5;
        }

        .slider-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            font-size: 0.75rem;
            color: #4b5563;
        }

        .slider-group div {
            display: flex;
            flex-direction: column;
        }

        .slider-group input[type="range"] {
            width: 100%;
            margin-top: 3px;
        }

        .add-btn {
            background-color: #10b981;
            margin-top: 5px;
            margin-bottom: 15px;
            width: 100%;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-btn:hover {
            background-color: #059669;
        }
        
        .apply-btn {
            background-color: var(--primary-color);
            width: 100%;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .apply-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- Spinner Section -->
        <div class="card">
            <h1>LET'S PLAY</h1>
            
            <div class="spinner-wrapper">
                <div class="pointer"></div>
                <canvas id="wheel" width="500" height="500"></canvas>
                <!-- Center Spin Button -->
                <button id="spinBtn" class="center-spin-btn" onclick="spinWheel()">AMLAN & STHITI TIME</button>
            </div>

            <div id="result"></div>
        </div>

        <!-- Customization Controls Section -->
        <div class="card controls-panel">
            <h2>Photo Control Panel</h2>
            <div id="itemsList"></div>
            
            <button class="add-btn" onclick="addSegment()">+ Add New Item</button>
            <button class="apply-btn" onclick="updateWheel()">Apply Changes to Wheel</button>
        </div>
    </div>

    <script>
        let segments = [
            { text: "Item 1", imgData: "https://picsum.photos/seed/201/100/100", color: "#E2CEB1", width: 45, height: 45, rotation: 0 },
            { text: "Item 2", imgData: "https://picsum.photos/seed/202/100/100", color: "#", width: 45, height: 45, rotation: 0 },
            { text: "Item 3", imgData: "https://picsum.photos/seed/203/100/100", color: "#", width: 45, height: 45, rotation: 0 },
            { text: "Item 4", imgData: "https://picsum.photos/seed/204/100/100", color: "#", width: 45, height: 45, rotation: 0 }
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");
        const resultDiv = document.getElementById("result");
        const itemsListContainer = document.getElementById("itemsList");

        let currentAngle = 0;
        let isSpinning = false;
        let loadedImages = [];

        function renderControls() {
            itemsListContainer.innerHTML = "";
            segments.forEach((seg, index) => {
                const row = document.createElement("div");
                row.className = "item-row";
                row.innerHTML = `
                    <div class="item-top">
                        <input type="text" value="${seg.text}" id="text-${index}" placeholder="Item Name">
                        <label class="file-upload-btn">
                            📁 Photo
                            <input type="file" accept="image/*" onchange="handleFileSelect(event, ${index})">
                        </label>
                        <button class="delete-btn" onclick="removeSegment(${index})">×</button>
                    </div>
                    <div class="slider-group">
                        <div>
                            <span>Width: <b id="w-val-${index}">${seg.width}</b>px</span>
                            <input type="range" min="15" max="100" value="${seg.width}" id="width-${index}" oninput="updateLiveValue(${index})">
                        </div>
                        <div>
                            <span>Height: <b id="h-val-${index}">${seg.height}</b>px</span>
                            <input type="range" min="15" max="100" value="${seg.height}" id="height-${index}" oninput="updateLiveValue(${index})">
                        </div>
                        <div>
                            <span>Rotate: <b id="r-val-${index}">${seg.rotation}</b>°</span>
                            <input type="range" min="0" max="360" value="${seg.rotation}" id="rot-${index}" oninput="updateLiveValue(${index})">
                        </div>
                    </div>
                `;
                itemsListContainer.appendChild(row);
            });
        }

        function updateLiveValue(index) {
            const w = document.getElementById(`width-${index}`).value;
            const h = document.getElementById(`height-${index}`).value;
            const r = document.getElementById(`rot-${index}`).value;

            document.getElementById(`w-val-${index}`).textContent = w;
            document.getElementById(`h-val-${index}`).textContent = h;
            document.getElementById(`r-val-${index}`).textContent = r;

            segments[index].width = parseInt(w);
            segments[index].height = parseInt(h);
            segments[index].rotation = parseInt(r);

            updateWheel();
        }

        function handleFileSelect(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    segments[index].imgData = e.target.result;
                    updateWheel();
                }
                reader.readAsDataURL(file);
            }
        }

        function addSegment() {
            const colors = ["#f87171", "#fb923c", "#fbbf24", "#34d399", "#60a5fa", "#a78bfa", "#f472b6"];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            segments.push({
                text: `Item ${segments.length + 1}`,
                imgData: `https://picsum.photos/seed/${Math.random()}/100/100`,
                color: randomColor,
                width: 45,
                height: 45,
                rotation: 0
            });
            renderControls();
            updateWheel();
        }

        function removeSegment(index) {
            if (segments.length <= 2) {
                alert("The wheel must have at least 2 segments!");
                return;
            }
            segments.splice(index, 1);
            renderControls();
            updateWheel();
        }

        function updateWheel() {
            segments.forEach((seg, index) => {
                const textInput = document.getElementById(`text-${index}`);
                if (textInput) seg.text = textInput.value;
            });
            initWheelImages();
        }

        function initWheelImages() {
            loadedImages = [];
            let count = 0;

            segments.forEach((seg, index) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = seg.imgData;
                img.onload = () => {
                    count++;
                    if (count === segments.length) drawWheel();
                };
                img.onerror = () => {
                    count++;
                    if (count === segments.length) drawWheel();
                };
                loadedImages.push(img);
            });
            drawWheel();
        }

        function drawWheel() {
            const numSegments = segments.length;
            const arcSize = (2 * Math.PI) / numSegments;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            segments.forEach((segment, index) => {
                const angle = index * arcSize;

                ctx.beginPath();
                ctx.fillStyle = segment.color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 5, angle, angle + arcSize);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arcSize / 2);

                const distFromCenter = radius * 0.58;

                if (loadedImages[index] && loadedImages[index].complete && loadedImages[index].naturalWidth !== 0) {
                    ctx.save();
                    ctx.translate(distFromCenter, 0);
                    ctx.rotate((segment.rotation * Math.PI) / 180);

                    ctx.drawImage(
                        loadedImages[index], 
                        -segment.width / 2, 
                        -segment.height / 2, 
                        segment.width, 
                        segment.height
                    );
                    ctx.restore();
                }

                ctx.restore();
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            resultDiv.textContent = "";

            const numSegments = segments.length;
            const arcSize = (2 * Math.PI) / numSegments;

            const randomExtraSpins = Math.floor(Math.random() * 5) + 4;
            const randomSegmentIndex = Math.floor(Math.random() * numSegments);
            
            const targetAngle = currentAngle + (randomExtraSpins * 2 * Math.PI) + (randomSegmentIndex * arcSize) + (arcSize / 2);

            currentAngle = targetAngle;
            canvas.style.transform = `rotate(-${currentAngle}rad)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;

                const normalizedAngle = currentAngle % (2 * Math.PI);
                const winningIndex = Math.floor((2 * Math.PI - (normalizedAngle % (2 * Math.PI))) / arcSize) % numSegments;

                resultDiv.textContent = `🎉 Result: ${segments[winningIndex].text}`;
            }, 4000);
        }

        renderControls();
        initWheelImages();
    </script>
</body>
</html>
